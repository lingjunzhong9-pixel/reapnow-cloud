server:
  port: 8083

spring:
  application:
    name: reapnow-order-service

  # ---- Nacos 配置中心：启动时按 dataId = <应用名>.yaml 拉取配置 ----
  config:
    import: optional:nacos:reapnow-order-service.yaml

  cloud:
    nacos:
      server-addr: 127.0.0.1:8848
      discovery:
        server-addr: 127.0.0.1:8848
        namespace: public
        metadata:
          version: "0.1.0"
      config:
        server-addr: 127.0.0.1:8848
        namespace: public
        file-extension: yaml
        refresh-enabled: true

    sentinel:
      transport:
        # Dashboard 地址（哨兵控制台），服务会主动向它上报心跳与实时指标
        dashboard: 127.0.0.1:8858
        port: 8719
      eager: true          # 启动即建立连接，不用等第一次请求
      log:
        dir: ./logs/sentinel

  datasource:
    url: jdbc:mysql://127.0.0.1:3307/reapnow?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: "${MYSQL_PASSWORD:}"
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

  # ---- Seata AT 分布式事务 ----

seata:
  enabled: true
  application-id: reapnow-order-service
  tx-service-group: reapnow_tx_group
  service:
    vgroup-mapping:
      reapnow_tx_group: default
    grouplist:
      default: 127.0.0.1:8091
  registry:
    type: file
  config:
    type: file
  data-source-proxy-mode: AT

management:
  endpoints:
    web:
      exposure:
        include: health,info,refresh,env
  endpoint:
    health:
      show-details: always
